<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>写给你的一段话</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    background:
      radial-gradient(
        circle at 50% 30%,
        #3b2a6b 0%,
        #1a1230 60%,
        #0d0818 100%
      );

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;

    color: #fff;
  }

  /* 星空 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%,
    100% {
      opacity: .15;
      transform: scale(.8);
    }

    50% {
      opacity: .9;
      transform: scale(1.3);
    }
  }

  /* 页面滚动区域 */
  .scroll {
    position: relative;
    z-index: 2;

    height: 100%;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding: 40px 24px 60px;

    display: flex;
    justify-content: center;
  }

  .wrap {
    max-width: 560px;
    width: 100%;

    text-align: left;
  }

  /* 文字 */
  .text {
    font-size: clamp(15px, 4vw, 18px);

    line-height: 2;

    letter-spacing: 1px;

    text-shadow:
      0 2px 20px rgba(255, 255, 255, .25);

    white-space: pre-wrap;
  }

  /* 音乐提示 */
  .hint {
    position: fixed;

    bottom: 18px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 12px;

    color: rgba(255, 255, 255, .4);

    z-index: 3;

    letter-spacing: 1px;

    pointer-events: none;
  }
</style>
</head>

<body>

<!-- 星空背景 -->
<div class="stars" id="stars"></div>

<!-- 文字 -->
<div class="scroll">
  <div class="wrap">
    <p class="text" id="text"></p>
  </div>
</div>

<!-- 音乐提示 -->
<div class="hint" id="hint">
  ♪ 轻触屏幕播放音乐
</div>

<!-- =========================
     背景音乐
     已替换成你的 MP3
     ========================= -->

<audio
  id="bgm"
  src="https://files.catbox.moe/elnjmj.mp3"
  loop
  preload="auto"
  playsinline>
</audio>


<script>

  /* =========================
     你想说的话
     ========================= */

  const MESSAGE = `洛池清：

见字如面。

最近听说你心情不太好。我想了很久要不要写点什么给你，后来觉得还是写下来吧，免得当面说的时候，我又只会嘻嘻哈哈拿客诉威胁你。

我们认识，是因为你是上西楼的主持。那时候我经常跑去找你玩，觉得你这人挺有意思。后来你换了格子，我就没怎么去了。再后来你去了歌厅。

我第一次点你唱歌，是因为失恋了，想听一首《你比从前快乐》。你学得很认真，唱得也很好听。从那以后，我就开始每天点你唱歌，和你互动，一直看你，逗你玩。我很喜欢拿客诉去威胁你，但其实你唱的每一首歌，我都听得很认真。

那首BGM，我一直觉得特别适合你。它让我觉得，你本来就该站在很多人面前，被很多人喜欢。

对我来说，你可能真的是一个很好的朋友。但我也真的希望你能开心。我希望你能成为一个很多人喜欢的小偶像——但我也想偷偷告诉你，对于我来说，你已经是我的偶像了。

其实我和很多人都推荐过你，也真的有很多人因为我推荐去点你唱歌。我真的很喜欢很多人喜欢你。你唱的每首歌我都录下来了。你真的是一个对待歌手这个职业很认真的小男孩。

所以，不管最近发生了什么，不管你是不是觉得自己不够好，或者只是累了、沮丧了，我都想跟你说：你很好，你值得被喜欢，也值得开心。你唱的歌，有人一直在听；你这个人，也有人一直在意。

等你心情好一点了，我再去点你唱歌。到时候，我可能还是会拿客诉威胁你，但你要知道，那只是因为我喜欢看你无奈又拿我没办法的样子。

希望你开心一点，哪怕只是一点点。

渐未央`;


  /* =========================
     星空背景
     ========================= */

  const stars = document.getElementById('stars');

  for (let i = 0; i < 60; i++) {

    const s = document.createElement('div');

    s.className = 'star';

    s.style.left =
      Math.random() * 100 + '%';

    s.style.top =
      Math.random() * 100 + '%';

    s.style.animationDelay =
      Math.random() * 3 + 's';

    const size =
      Math.random() * 2 + 1.5;

    s.style.width =
      size + 'px';

    s.style.height =
      size + 'px';

    stars.appendChild(s);
  }


  /* =========================
     显示文字
     ========================= */

  document.getElementById('text').textContent =
    MESSAGE;


  /* =========================
     背景音乐
     ========================= */

  const bgm =
    document.getElementById('bgm');

  const hint =
    document.getElementById('hint');


  /* 音量 */
  bgm.volume = 0.45;


  /* =========================
     播放音乐
     ========================= */

  function tryPlay() {

    bgm.play()
      .then(() => {

        hint.textContent =
          '♪ 正在播放《超级偶像》';

        hint.style.opacity = '1';

      })
      .catch(() => {

        hint.textContent =
          '♪ 轻触屏幕播放音乐';

        hint.style.opacity = '1';

      });

  }


  /* =========================
     微信兼容
     ========================= */

  if (typeof WeixinJSBridge !== 'undefined') {

    tryPlay();

  } else {

    document.addEventListener(
      'WeixinJSBridgeReady',
      tryPlay,
      false
    );

  }


  /* =========================
     手机点击后播放
     ========================= */

  document.addEventListener(
    'touchstart',
    function once() {

      tryPlay();

      document.removeEventListener(
        'touchstart',
        once
      );

    },
    { once: true }
  );


  /* =========================
     电脑点击后播放
     ========================= */

  document.addEventListener(
    'click',
    function once() {

      tryPlay();

      document.removeEventListener(
        'click',
        once
      );

    },
    { once: true }
  );


  /* 页面加载 */
  document.addEventListener(
    'DOMContentLoaded',
    function() {

      tryPlay();

    }
  );

</script>

</body>
</html>
